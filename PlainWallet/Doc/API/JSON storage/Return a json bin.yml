info:
  name: Return a json bin
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/bin/:id"
  params:
    - name: ""
      value: ""
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: https://json.extendsclass.com

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Bin data
    request:
      url: "{{baseUrl}}/bin/:id"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 404 Response
    description: Bin not found
    request:
      url: "{{baseUrl}}/bin/:id"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 422 Response
    description: Id must be specified
    request:
      url: "{{baseUrl}}/bin/:id"
      method: GET
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
