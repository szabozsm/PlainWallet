info:
  name: Partially update a json bin with JSON Merge Patch
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/bin/:id"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Bin data updated
    request:
      url: "{{baseUrl}}/bin/:id"
      method: PATCH
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "data": {}
          }
  - name: 401 Response
    description: Wrong security key
    request:
      url: "{{baseUrl}}/bin/:id"
      method: PATCH
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 404 Response
    description: Bin not found
    request:
      url: "{{baseUrl}}/bin/:id"
      method: PATCH
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 413 Response
    description: JSON data too large
    request:
      url: "{{baseUrl}}/bin/:id"
      method: PATCH
    response:
      status: 413
      statusText: Payload Too Large
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 422 Response
    description: Id must be specified
    request:
      url: "{{baseUrl}}/bin/:id"
      method: PATCH
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
