info:
  name: Delete a json bin
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/bin/:id"
  headers:
    - name: Security-key
      value: abcd123
      disabled: true
  params:
    - name: id
      value: 5c3fe531afb2
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Status of the deletion
    request:
      url: "{{baseUrl}}/bin/:id"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0
          }
  - name: 401 Response
    description: Wrong security key
    request:
      url: "{{baseUrl}}/bin/:id"
      method: DELETE
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 404 Response
    description: Bin not found
    request:
      url: "{{baseUrl}}/bin/:id"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 422 Response
    description: Id must be specified
    request:
      url: "{{baseUrl}}/bin/:id"
      method: DELETE
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
